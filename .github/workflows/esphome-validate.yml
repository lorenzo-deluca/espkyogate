name: ESPHome Config Validation

on:
  push:
    branches:
      - master
  pull_request:
  release:
    types:
      - published

# ESPHome 2026.10 and later require Python >= 3.12. With an older interpreter pip
# silently resolves "latest"/"--pre" to a much older ESPHome release that still
# supports it, so CI stays green while current ESPHome releases fail to build.
env:
  PYTHON_VERSION: '3.13'

jobs:
  validate:
    name: Compile (${{ matrix.config }} - ${{ matrix.channel }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, beta]
        config:
          - tests/test_full.yaml
          - tests/test_minimal.yaml
          - tests/test_alarm_only.yaml
          - tests/test_alarm_code_protection.yaml
          - tests/test_sensors_only.yaml
          - tests/test_controls.yaml
          - tests/test_32_zones.yaml
          - tests/test_pulse_output.yaml
          - tests/test_zone_datetime.yaml
          - tests/test_debug_switches.yaml
        include:
          # Pin the release the component is known to target, so a moving
          # "stable"/"beta" can't hide a breakage with it.
          - channel: '2026.11.0'
            config: tests/test_full.yaml
          - channel: '2026.11.0'
            config: tests/test_minimal.yaml
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ESPHome (${{ matrix.channel }})
        run: |
          case "${{ matrix.channel }}" in
            beta)   pip install --upgrade --pre esphome ;;
            stable) pip install --upgrade esphome ;;
            *)      pip install "esphome==${{ matrix.channel }}" ;;
          esac
          esphome version
      - name: Compile ${{ matrix.config }}
        run: esphome compile ${{ matrix.config }}

  # The shipped example (espkyogate_configuration.yaml) is what users copy, but it
  # points external_components at GitHub, so it is compiled here against the
  # checked-out component, and with the placeholder secrets.yaml it ships with.
  example-config:
    name: Compile example config (${{ matrix.channel }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, beta, '2026.11.0']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ESPHome (${{ matrix.channel }})
        run: |
          case "${{ matrix.channel }}" in
            beta)   pip install --upgrade --pre esphome ;;
            stable) pip install --upgrade esphome ;;
            *)      pip install "esphome==${{ matrix.channel }}" ;;
          esac
          esphome version
      - name: Point the example at the checked-out component
        run: |
          sed 's#source: github://lorenzo-deluca/espkyogate#source: {type: local, path: components}#' \
            espkyogate_configuration.yaml > ci_example.yaml
          grep -q 'type: local' ci_example.yaml
      - name: Compile espkyogate_configuration.yaml
        run: esphome compile ci_example.yaml

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run decode_panel_name tests
        run: |
          g++ -std=c++17 -Wall -Wextra -o test_decode_panel_name tests/test_decode_panel_name.cpp
          ./test_decode_panel_name
      - name: Compile and run partition_status_fallback tests
        run: |
          g++ -std=c++17 -Wall -Wextra -o test_partition_status_fallback tests/test_partition_status_fallback.cpp
          ./test_partition_status_fallback

  validate-negative:
    name: Validate Invalid Config (${{ matrix.channel }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, beta]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ESPHome (${{ matrix.channel }})
        run: |
          if [ "${{ matrix.channel }}" = "beta" ]; then
            pip install --upgrade --pre esphome
          else
            pip install --upgrade esphome
          fi
          esphome version
      - name: Validate invalid output_number test
        run: |
          if esphome config tests/test_invalid_output_number.yaml; then
            echo "Expected config validation to fail for output_number > 16"
            exit 1
          fi
