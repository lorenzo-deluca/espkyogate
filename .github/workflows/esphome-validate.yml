name: ESPHome Config Validation

on:
  push:
    branches:
      - master
  pull_request:
  release:
    types:
      - published

jobs:
  validate:
    name: Compile (${{ matrix.config }} - ${{ matrix.channel }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, beta]
        config:
          - tests/test_full.yaml
          - tests/test_minimal.yaml
          - tests/test_alarm_only.yaml
          - tests/test_alarm_code_protection.yaml
          - tests/test_sensors_only.yaml
          - tests/test_controls.yaml
          - tests/test_32_zones.yaml
          - tests/test_pulse_output.yaml
          - tests/test_zone_datetime.yaml
          - tests/test_debug_switches.yaml
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ESPHome (${{ matrix.channel }})
        run: |
          if [ "${{ matrix.channel }}" = "beta" ]; then
            pip install --upgrade --pre esphome
          else
            pip install --upgrade esphome
          fi
      - name: Compile ${{ matrix.config }}
        run: esphome compile ${{ matrix.config }}

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run decode_panel_name tests
        run: |
          g++ -std=c++17 -Wall -Wextra -o test_decode_panel_name tests/test_decode_panel_name.cpp
          ./test_decode_panel_name
      - name: Compile and run partition_status_fallback tests
        run: |
          g++ -std=c++17 -Wall -Wextra -o test_partition_status_fallback tests/test_partition_status_fallback.cpp
          ./test_partition_status_fallback

  validate-negative:
    name: Validate Invalid Config (${{ matrix.channel }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, beta]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ESPHome (${{ matrix.channel }})
        run: |
          if [ "${{ matrix.channel }}" = "beta" ]; then
            pip install --upgrade --pre esphome
          else
            pip install --upgrade esphome
          fi
      - name: Validate invalid output_number test
        run: |
          if esphome config tests/test_invalid_output_number.yaml; then
            echo "Expected config validation to fail for output_number > 16"
            exit 1
          fi
